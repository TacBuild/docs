StylesPath = styles
MinAlertLevel = suggestion
Vocab = TAC

[*.{md,mdx}]
BasedOnStyles = TAC

[formats]
mdx = md

[*.mdx]
CommentDelimiters = {/*, */}
TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>)
BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*})
